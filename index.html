<body>
<header><div class="band"></div><div class="wrap">
 <div class="top">
  <h1><a href="#">Records of the Department of State Relating to Internal Affairs of Japan, 1930–1949</a></h1>
  <button class="theme" id="theme" title="Toggle light/dark">◐</button>
 </div>
 <nav><a href="#" data-v="files">Files</a><a href="#sets" data-v="sets" id="setsBtn" aria-haspopup="true" aria-expanded="false">Sets ▾</a><a href="#people" data-v="people">People</a><a href="#places" data-v="places">Places</a><a href="#keywords" data-v="keywords">Keywords</a><a href="#fulltext" data-v="fulltext">Full text</a><a href="#spotlight" data-v="spotlight">Spotlight</a><a href="#about" data-v="about">About</a><a href="#marked" data-v="marked">View Marked</a><a href="#tags" data-v="tags">View Tags</a></nav>
 <div class="search" id="searchbar">
  <input type="search" id="q" placeholder="Search titles, summaries, people, places, keywords…">
  <select id="cls"><option value="">All subjects</option></select>
  <select id="yr"><option value="">All years</option></select>
  <button id="reset" type="button" title="Clear search, filters and sorting">Reset</button>
 </div>
</div></header>
<main class="wrap" id="main"></main>
<script src="data.js"></script>
<script src="spotlight-data.js"></script>
<script src="sets.js"></script>
<script>
const D = window.CATALOG || [], EXPECTED = window.CATALOG_EXPECTED || D.length;
const $ = s => document.querySelector(s), main = $('#main');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IA = id => 'https://archive.org/details/' + id;
const IAX = x => IA(x.ia || x.id);
// archive.org page links: /details/<item>/page/n<leaf>. Items holding several PDFs (split files) need the PDF's
// name WITHOUT ".pdf" before /page/ to pick the part; with ".pdf" the viewer does not load.
const iaBook = (ia, iaf, id) => IA(ia || id) + (iaf && /-part-\d+$/.test(id) ? '/' + encodeURIComponent(iaf.replace(/\.pdf$/i, '')) : '');
const IAP = (x, p) => iaBook(x.ia, x.iaf, x.id) + '/page/n' + ((p||1) - 1) + '/mode/1up';
const PDF = f => '../' + encodeURIComponent(f);
const CLASSES = {'00':'Political affairs','01':'Government','02':'Executive','03':'Legislature','04':'Judiciary & law','05':'International courts',
 '1':'Public order, health & regulation','2':'Military','3':'Naval','4':'Social & cultural','5':'Economic & financial','6':'Industry & agriculture',
 '7':'Communications & transport','8':'Navigation & shipping','9':'Press & science'};
function cls(dec){const m=dec.match(/^89\d[A-Z]?\.(\d+)/); if(!m) return 'Other (outside 894)'; const n=m[1];
 if(n[0]==='0') return CLASSES[n.slice(0,2)] || 'Political affairs'; return CLASSES[n[0]] || 'Other';}
const years = x => { const ys = (x.t.match(/\b19[1-5]\d\b/g) || []).map(Number); return ys.length ? [Math.min(...ys), Math.max(...ys)] : null; };
D.forEach(x => { x.c = cls(x.dec); x.y = years(x);
  x.blob = [x.t, x.o, x.i, x.k.join(' '), x.pl.map(p=>p[0]).join(' '), x.pe.map(p=>p[0]+' '+p[1]).join(' '),
    x.sub.map(s => [s.t, s.a, s.s, s.fr, s.to, s.k.join(' ')].join(' ')).join(' ')].join(' ').toLowerCase(); });

// filters
[...new Set(D.map(x => x.c))].sort().forEach(c => $('#cls').insertAdjacentHTML('beforeend', `<option>${esc(c)}</option>`));
$('#yr').insertAdjacentHTML('beforeend', '<optgroup label="Periods">' + ['1930-1935','1936-1940','1941-1945','1946-1949','1930-1941']
  .map(r => `<option value="${r}">${r.replace('-','–')}</option>`).join('') + '</optgroup><optgroup label="Single years">');
for (let y = 1920; y <= 1953; y++) if (D.some(x => x.y && x.y[0] <= y && y <= x.y[1])) $('#yr optgroup:last-child').insertAdjacentHTML('beforeend', `<option value="${y}-${y}">${y}</option>`);

const MONS=['january','february','march','april','may','june','july','august','september','october','november','december'];
function titleDates(t){ const out=[]; const rx=/\b(January|February|March|April|May|June|July|August|September|October|November|December)(?:\s+(\d{1,2})(?:st|nd|rd|th)?)?,\s*(\d{4})\b/g; let m;
  while((m=rx.exec(t))) out.push(m[3]+'.'+String(MONS.indexOf(m[1].toLowerCase())+1).padStart(2,'0')+(m[2]?'.'+m[2].padStart(2,'0'):''));
  return out.length ? out.slice(0,2).join(' – ') : ''; }
function era(db){ const d = db.split(' – ')[0].split('.').map(Number); const v = d[0]*10000 + d[1]*100 + (d[2]||0);
  return v < 19411200 ? ['e1','Pre-war (to November 1941)'] : v <= 19450815 ? ['e2','Pacific War (December 1941 – 15 August 1945)'] : ['e3','Occupation (from 16 August 1945)']; }
const S = {q:'', cls:'', yr:'', minpg:0, sort:'year', rev:false, per:200, page:0, facet:null, ftGroup:false, ftSort:'rel', fsort:'n'};
function terms(){ return S.q.toLowerCase().match(/"[^"]+"|\S+/g)?.map(t => t.replace(/"/g,'')) || []; }
function hl(s, extra=[]){ let out = esc(s); for (const t of [...terms(), ...extra]) if (t.length > 1) out = out.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'), '<mark>$1</mark>'); return out; }
function filtered(){
  const ts = terms();
  let r = D.filter(x => x.pg >= S.minpg && (!S.cls || x.c === S.cls) && (!S.yr || (x.y && x.y[0] <= +S.yr.split('-')[1] && +S.yr.split('-')[0] <= x.y[1]))
    && ts.every(t => x.blob.includes(t)));
  if (S.facet){ const [k,v] = S.facet; r = r.filter(x => k==='pe' ? x.pe.some(p=>p[0]===v) : k==='pl' ? x.pl.some(p=>p[0]===v)
      : x.k.includes(v) || x.sub.some(s => s.k.includes(v))); }
  const hits = x => ts.reduce((n,t) => n + x.blob.split(t).length - 1, 0);
  const yr = x => x.y ? x.y[0] : 9999;
  const key = {year: x => [yr(x), x.d || '9999', x.n], title: x => [x.t.replace(/^\S+\s+/,'').toLowerCase(), x.n], pages: x => [-x.pg, x.n],
    docs: x => [-x.sub.length, x.n], subject: x => [x.c, x.dec, yr(x), x.n], dec: x => [x.dec, yr(x), x.n], hits: x => [-hits(x), x.n]}[S.sort];
  r.sort((a,b) => { const A = key(a), B = key(b); for (let i=0;i<A.length;i++){ if (A[i]<B[i]) return -1; if (A[i]>B[i]) return 1;} return 0; });
  return S.rev ? r.reverse() : r;
}
const inFile = (x, kind, v) => `#d/${x.id}/${kind}/${encodeURIComponent(v)}`;

  <p>${D.length} files, ${pages.toLocaleString()} pages and ${subs.toLocaleString()} individual documents are catalogued so far. Each entry was generated by a language model (Gemini 3.8 Flash or OpenAI GPT-5.6 via Codex; the model used for each file is recorded in <code>catalog.sqlite</code>) from OCR text (Mistral OCR 3, or PaddleOCR for the large merged files), so summaries, names and dates may contain errors — check the page images before relying on them. Mention counts for people and places are counted in the OCR text.</p>
  <p>Full collection: <a href="https://archive.org/details/japan-internal-affairs-1930-1949" target="_blank">archive.org/details/japan-internal-affairs-1930-1949</a>. </p>
  <p><b>Downloads.</b> <a href="downloads/japan-internal-affairs-ocr-text.jsonl.gz">All OCR text</a> (one JSON line per page, gzip, about 21 MB) and the <a href="downloads/japan-internal-affairs-catalog.sqlite">catalogue database</a> (SQLite, about 50 MB). Please use these rather than scraping the site; see also <a href="llms.txt">llms.txt</a>.</p></div>`;
}
function route(){
  let h = decodeURIComponent(location.hash.slice(1)); S.facet = null;
  if (h.startsWith('fulltext/')){ S.q = h.slice(9); $('#q').value = S.q; h = 'fulltext'; }  // shareable link: #fulltext/<query>
  const SET = SETS.find(s => s.id === h);
  const view = SET ? 'set' : h === 'sets' ? 'sets' : h.startsWith('d/') ? 'detail' : h.startsWith('s/') ? 'spotdetail' : h === 'tags' || h.startsWith('tags/') ? 'tags' : ['people','places','keywords','about','fulltext','spotlight','marked'].includes(h) ? h : 'files';
  document.body.classList.toggle('detail', view==='detail' || view==='spotdetail');
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.v === (view==='detail'?'files':view==='spotdetail'?'spotlight':view==='set'?'sets':view)));
  $('#cls').style.display = $('#yr').style.display = $('#reset').style.display = (view==='files' || view==='fulltext') ? '' : 'none';
  $('#q').placeholder = view === 'fulltext' ? 'Search the full OCR text of every page…' : 'Search titles, summaries, people, places, keywords…';
  if (view === 'detail'){ const [, id, kind, ...v] = h.split('/'); return detailView(id, kind, v.length ? v.join('/') : null); }
  if (view === 'spotdetail') return spotlightDetail(h.slice(2));
  if (view === 'spotlight') return spotlightView();
  if (view === 'about') return aboutView();
  if (view === 'set') return setView(SET);
  if (view === 'sets') return setsIndex();
  if (view === 'marked') return markedView();
  if (view === 'tags') return tagsView(h.startsWith('tags/') ? h.slice(5) : null);
  if (view === 'fulltext') return ftView();
  if (view !== 'files') return facetView(view);
  if (h.startsWith('f/')){ const [, k, ...v] = h.split('/'); S.facet = [k, v.join('/')]; }
  listView();
}
let tmr; $('#q').addEventListener('input', e => { clearTimeout(tmr); tmr = setTimeout(() => { S.q = e.target.value; S.page = 0;
  if (S.q && S.sort==='year') S.sort='hits'; if (!S.q && S.sort==='hits') S.sort='year'; if (location.hash.startsWith('#d/')) location.hash = ''; else route(); }, 200); });
['cls','yr'].forEach(k => $('#'+k).addEventListener('change', e => { S[k] = e.target.value; S.page = 0; route(); }));
$('#reset').addEventListener('click', () => { Object.assign(S, {q:'', cls:'', yr:'', minpg:0, sort:'year', rev:false, per:200, page:0, facet:null, ftGroup:false, ftSort:'rel', fsort:'n'});
  $('#q').value = ''; $('#cls').value = ''; $('#yr').value = '';
  if (location.hash && location.hash !== '#') location.hash = ''; else route(); scrollTo(0,0); });
addEventListener('hashchange', () => { scrollTo(0,0); route(); });
$('#theme').addEventListener('click', () => { const r = document.documentElement, dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = r.dataset.theme || (dark ? 'dark' : 'light'); r.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', r.dataset.theme); } catch(e){} });
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
route();
</script>
